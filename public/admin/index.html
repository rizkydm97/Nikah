<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin Undangan</title>
<link rel="stylesheet" href="/admin/admin.css?v=65">
</head>
<body>
<!-- Layar status: selalu tampil lebih dulu supaya halaman TIDAK PERNAH kosong -->
<div id="boot" class="login">
  <div class="lcard" id="bootCard">
    <h1>Admin Undangan</h1>
    <p id="bootMsg">Memuat…</p>
    <div id="bootAct" class="bootact" hidden>
      <button class="btn pri" type="button" onclick="location.reload()">Coba lagi</button>
      <a class="btn" href="/api/health" target="_blank" rel="noopener">Cek status server</a>
    </div>
  </div>
</div>
<noscript><div class="login"><div class="lcard"><h1>Admin Undangan</h1><p>JavaScript harus aktif untuk membuka halaman admin.</p></div></div></noscript>

<div id="login" class="login" hidden>
  <form id="loginForm" class="lcard">
    <h1>Admin Undangan</h1>
    <p>Masuk untuk mengubah seluruh isi undangan.</p>
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password" required>
    <button class="btn pri" type="submit">Masuk</button>
    <div id="loginErr" class="err"></div>
  </form>
</div>

<div id="app" hidden>
  <header class="top">
    <button id="menuBtn" class="ghost menu" aria-label="Menu">☰</button>
    <strong class="brand">Admin Undangan</strong>
    <span id="dirty" class="dirty" hidden>● Belum disimpan</span>
    <span class="sp"></span>
    <button id="pvToggle" class="ghost">Pratinjau</button>
    <a class="ghost" href="/" target="_blank" rel="noopener">Buka undangan ↗</a>
    <button id="saveBtn" class="btn done">Tersimpan ✓</button>
    <button id="logout" class="ghost">Keluar</button>
  </header>
  <div class="wrap">
    <div id="navBack" class="navback"></div>
    <nav id="nav" class="nav"></nav>
    <main id="main" class="main"></main>
    <aside id="preview" class="preview">
      <div class="pvbar"><span>Pratinjau langsung</span>
        <select id="pvMode"><option value="">Isi undangan</option><option value="1">Cover</option></select>
        <select id="pvGuest"><option value="">Tanpa nama tamu</option><option value="Yogi dan Ratna">Yogi dan Ratna</option></select>
        <button id="pvReload" class="ghost sm">↻</button></div>
      <div class="phone"><iframe id="pvFrame" title="Pratinjau"></iframe></div>
    </aside>
  </div>
  <div id="savebar" class="savebar" hidden>
    <div class="sbtxt"><b id="sbMsg"></b><small id="sbSub"></small></div>
    <a class="btn sbview" href="/" target="_blank" rel="noopener">Lihat hasilnya ↗</a>
    <div class="sbbtns"><button id="sbDiscard" class="btn" type="button">Batalkan perubahan</button><button id="sbSave" class="btn pri" type="button">Simpan perubahan</button></div>
  </div>
</div>

<div id="lib" class="modal" hidden>
  <div class="mbox"><div class="mh"><strong>Pustaka file</strong><button class="ghost" data-close>✕</button></div><div id="libGrid" class="libgrid"></div></div>
</div>
<div id="adj" class="modal" hidden>
  <div class="mbox adjbox"><div class="mh"><strong>Atur posisi &amp; ukuran foto</strong><button class="ghost" data-close>✕</button></div><div id="adjBody"></div></div>
</div>
<div id="toast" class="toast"></div>

<script>
/* Penangkap galat paling awal: bila skrip admin gagal dimuat/jalan, pesannya tampil di layar (bukan layar kosong). */
(function () {
  window.__adminFail = function (msg) {
    var m = document.getElementById('bootMsg'), a = document.getElementById('bootAct'), b = document.getElementById('boot');
    if (!m) return;
    ['login', 'app'].forEach(function (i) { var e = document.getElementById(i); if (e) e.hidden = true; });
    b.hidden = false; m.textContent = msg; m.className = 'err'; a.hidden = false;
  };
  window.addEventListener('error', function (e) {
    var t = e.target;
    if (t && t.tagName === 'SCRIPT') window.__adminFail('File ' + (t.getAttribute('src') || 'skrip') + ' gagal dimuat. Pastikan folder public/admin ikut ter-deploy.');
    else if (!window.__adminReady) window.__adminFail('Terjadi galat: ' + (e.message || 'tidak diketahui'));
  }, true);
  window.addEventListener('unhandledrejection', function (e) { if (!window.__adminReady) window.__adminFail('Terjadi galat: ' + ((e.reason && e.reason.message) || e.reason)); });
  setTimeout(function () { if (!window.__adminReady) window.__adminFail('Admin tidak merespons. Periksa koneksi, lalu klik "Cek status server" untuk melihat apa yang kurang.'); }, 20000);
})();
</script>
<script src="/admin/schema.js?v=65"></script>
<script src="/admin/ux.js?v=65"></script>
<script src="/admin/admin.js?v=65"></script>
</body>
</html>
