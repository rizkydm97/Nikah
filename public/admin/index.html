<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin Undangan</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form id="loginForm" class="lcard">
    <h1>Admin Undangan</h1>
    <p>Masuk untuk mengubah seluruh isi undangan.</p>
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus required>
    <button class="btn pri" type="submit">Masuk</button>
    <div id="loginErr" class="err"></div>
  </form>
</div>

<div id="app" hidden>
  <header class="top">
    <button id="menuBtn" class="ghost menu" aria-label="Menu">☰</button>
    <strong class="brand">Admin Undangan</strong>
    <span id="dirty" class="dirty" hidden>● Belum disimpan</span>
    <span class="sp"></span>
    <button id="pvToggle" class="ghost">Pratinjau</button>
    <a class="ghost" href="/" target="_blank" rel="noopener">Buka undangan ↗</a>
    <button id="saveBtn" class="btn pri">Simpan</button>
    <button id="logout" class="ghost">Keluar</button>
  </header>
  <div class="wrap">
    <nav id="nav" class="nav"></nav>
    <main id="main" class="main"></main>
    <aside id="preview" class="preview">
      <div class="pvbar"><span>Pratinjau langsung</span>
        <select id="pvMode"><option value="">Isi undangan</option><option value="1">Cover</option></select>
        <select id="pvGuest"><option value="">Tanpa nama tamu</option><option value="Yogi dan Ratna">Yogi dan Ratna</option></select>
        <button id="pvReload" class="ghost sm">↻</button></div>
      <div class="phone"><iframe id="pvFrame" title="Pratinjau"></iframe></div>
    </aside>
  </div>
</div>

<div id="lib" class="modal" hidden>
  <div class="mbox"><div class="mh"><strong>Pustaka file</strong><button class="ghost" data-close>✕</button></div><div id="libGrid" class="libgrid"></div></div>
</div>
<div id="toast" class="toast"></div>
<script src="schema.js"></script>
<script src="admin.js"></script>
</body>
</html>
