<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/invitation.css"><link rel="stylesheet" href="/dayak.css"><style>html,body{margin:0;background:transparent}#r{position:relative;container-type:size}.pbox{position:absolute!important;left:0!important;top:0!important;width:100%!important;height:100%!important;transform:none!important;container-type:inline-size;overflow:hidden}svg{display:block}</style></head><body class="dk-static"><div id="r"></div>
<script src="/dayak.js"></script><script>
const D=DAYAK,j=new URLSearchParams(location.search).get('j'),r=document.getElementById('r');r.style.width=innerWidth+'px';r.style.height=innerHeight+'px';
const sv=(vb,inner)=>`<svg viewBox="${vb}" width="100%" height="100%">${inner}</svg>`;
const J={
 W:()=>`<div class="pbox">${D.world()}</div>`,
 BG:()=>`<div class="pbox">${D.world({bg:1})}</div>`,
 FLT:()=>{const side=(fl)=>`<g transform="${fl?'translate(1000 0) scale(-1 1)':''}"><g transform="translate(40 -30)">${D.leaf(2.6,150,['#2f6e3c','#1a4a2c'])}</g><g transform="translate(150 -40)">${D.leaf(2.1,172,['#3d8a4a','#1e5a34'])}</g><g transform="translate(-30 120)">${D.leaf(2,125,['#2a6438','#163e26'])}</g><g transform="translate(230 -20)">${D.blade(2,165,'#2f7a40')}</g><g transform="translate(300 -10)">${D.blade(1.5,150,'#3d8a4a')}</g>
   <g transform="translate(70 40) rotate(140)">${D.fan(6,120,80)}</g>${[[260,200,2.2,170],[200,280,1.8,150],[330,150,1.6,200],[90,300,1.7,140]].map(([x,y,s2,r2])=>`<path d="M${x} 0 Q${x-10} ${y/2} ${x} ${y-20}" stroke="#3f6f32" stroke-width="4" fill="none"/><g transform="translate(${x} ${y})">${D.orchid(s2,r2)}</g>`).join('')}</g>`;return sv('0 0 1000 700',side(0)+side(1))},
 FLB:()=>`<div style="position:absolute;left:-90px;bottom:-60px;width:660px">${D.bush(0,1)}</div><div style="position:absolute;right:-90px;bottom:-60px;width:660px">${D.bush(1,5)}</div>`,
 ARC:()=>{let h=`<path d="M60 580 A500 500 0 0 1 1060 580" stroke="#3f6f32" stroke-width="7" fill="none"/>`;const n=30;for(let i=0;i<=n;i++){const a=Math.PI*(1-i/n),x=560+Math.cos(a)*500,y=580-Math.sin(a)*500,rot=90-a*57.3;h+=`<g transform="translate(${x} ${y}) rotate(${rot})"><g transform="rotate(${i%2?-70:70})">${D.leaf(.62,0,i%2?['#3d8a4a','#1e5a34']:['#2f7a45','#1a4a2c'])}</g></g>`;}
  for(let i=1;i<n;i+=3){const a=Math.PI*(1-i/n),x=560+Math.cos(a)*500,y=580-Math.sin(a)*500;h+=`<g transform="translate(${x} ${y})">${D.orchid(1.5,90-a*57.3)}</g>`;}
  for(let i=2;i<n;i+=6){const a=Math.PI*(1-i/n),x=560+Math.cos(a)*500,y=580-Math.sin(a)*500;h+=`<g transform="translate(${x} ${y}) rotate(${90-a*57.3-90})">${D.feather(96,11)}</g>`;}
  h+=`<g transform="translate(560 84)">${D.motif(1.2)}</g>`;return sv('0 0 1120 600',h)},
 SIDE:()=>sv('0 0 120 640',`<path d="M60 0 Q40 160 66 320 Q86 480 58 640" stroke="#3f6f32" stroke-width="5" fill="none"/>${[60,170,280,390,500,600].map((y,i)=>`<g transform="translate(${60+(i%2?10:-10)} ${y}) rotate(${i%2?50:-50})">${D.leaf(.4,0,['#3d8a4a','#1e5a34'])}</g>`).join('')}<g transform="translate(64 330)">${D.orchid(.9,0)}</g>`),
 BQ:()=>sv('0 0 640 762',`<g transform="translate(320 560)">${[-40,-15,15,40].map(a=>`<g transform="rotate(${a})">${D.feather(330,26)}</g>`).join('')}${D.leaf(1.6,-40)}${D.leaf(1.5,40,['#3d8a4a','#1e5a34'])}${D.leaf(1.3,-80,['#2a6438','#163e26'])}${D.leaf(1.3,80)}</g>${[[320,380,2.3,0],[230,440,1.9,-30],[410,440,1.9,30],[280,520,1.7,-10],[370,520,1.6,20],[320,600,1.5,0]].map(([x,y,s,r])=>`<g transform="translate(${x} ${y})">${D.orchid(s,r)}</g>`).join('')}<g transform="translate(470 640)">${D.pitcher(1.6,14)}</g><g transform="translate(170 640)">${D.pitcher(1.4,-14)}</g>`),
 ORN:()=>sv('-77 -70 154 141',`<g transform="scale(1.25)">${D.motif(1,['#e2b552','#c42a2a','#f6efe2'])}</g>`),
 DIV:()=>sv('0 0 334 125',`<path d="M10 62 H130 M204 62 H324" stroke="#c99a3c" stroke-width="2.4"/><g transform="translate(167 62)">${D.motif(.62,['#e2b552','#c42a2a','#2a1d18'])}</g><g transform="translate(118 62) rotate(-90)">${D.curl(.42,'#c42a2a',4)}</g><g transform="translate(216 62) rotate(90)">${D.curl(.42,'#c42a2a',4,1)}</g><circle cx="12" cy="62" r="4" fill="#c99a3c"/><circle cx="322" cy="62" r="4" fill="#c99a3c"/>`),
 MOT:()=>sv('0 0 220 220',`<rect width="220" height="220" fill="#efe2cc"/>${[[55,55],[165,165]].map(([x,y])=>`<g transform="translate(${x} ${y})" opacity=".55">${D.motif(.62,['#a8742a','#9a3a24','#6a4a2a'])}</g>`).join('')}${[[165,55],[55,165]].map(([x,y])=>`<g transform="translate(${x} ${y}) rotate(45)" opacity=".4">${D.motif(.4,['#9a3a24','#a8742a','#6a4a2a'])}</g>`).join('')}`),
 FEA:()=>sv('-30 -196 60 200',D.feather(190,26)),
 LEAF:()=>sv('-70 -170 140 180',D.leaf(1.15,0)),
 ORC:()=>sv('-35 -35 70 70',D.orchid(1,0)),
 BFR:()=>`<div style="width:260px">${D.birdwing().replace('class="dk-bw"','class="dk-bw" style="transform:none"')}</div>`,
};
r.innerHTML=J[j]();
</script></body></html>
